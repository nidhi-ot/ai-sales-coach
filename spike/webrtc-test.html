<!DOCTYPE html>
<html>
  <head>
    <title>WebRTC Spike</title>
    <style>
      .controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }

      .status {
        padding: 4px 10px;
        border-radius: 999px;
        background: #e5e7eb;
        font-family: sans-serif;
        font-size: 14px;
      }

      .status[data-state="connecting"] {
        background: #fef3c7;
      }

      .status[data-state="active"] {
        background: #dcfce7;
      }

      .status[data-state="ending"],
      .status[data-state="ended"] {
        background: #e0e7ff;
      }

      .status[data-state="error"] {
        background: #fee2e2;
      }
    </style>
  </head>

  <body>
    <h1>OpenAI Realtime WebRTC Test</h1>

    <div class="controls">
      <button id="start">Start Call</button>
      <button id="endCall" disabled>End Call</button>
      <span id="timer">00:00 / 03:00</span>
      <span id="callStatus" class="status" data-state="idle">Idle</span>
      <button id="downloadLog">Download Log</button>
    </div>

    <pre id="log"></pre>

    <script>
      // The visible log stays readable. Full Realtime payloads go to console.debug.
      const logMessages = [];

      // Keep this configurable for later. Current test limit: 3 minutes.
      const MAX_CALL_MS = 3 * 60 * 1000;
      const DISCONNECT_GRACE_MS = 5000;

      // Shared WebRTC handles. Any end path can close these safely.
      let peerConnection = null;
      let dataChannel = null;
      let localStream = null;

      // Session state used for transcript persistence and one-time cleanup.
      let supabaseSessionId = null;
      let callStartedAt = null;
      let timerIntervalId = null;
      let maxCallTimeoutId = null;
      let disconnectGraceTimeoutId = null;
      let transcriptSaveChain = Promise.resolve();
      let callState = "idle";
      let endingCall = false;

      const startButton = document.getElementById("start");
      const endCallButton = document.getElementById("endCall");
      const timerEl = document.getElementById("timer");
      const statusEl = document.getElementById("callStatus");
      const logEl = document.getElementById("log");

      // UI timer helpers keep display logic separate from call cleanup.
      function formatTime(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
        const seconds = String(totalSeconds % 60).padStart(2, "0");
        return `${minutes}:${seconds}`;
      }

      function updateTimer() {
        const elapsedMs = callStartedAt ? Date.now() - callStartedAt : 0;
        timerEl.textContent = `${formatTime(
          Math.min(elapsedMs, MAX_CALL_MS)
        )} / ${formatTime(MAX_CALL_MS)}`;
      }

      // Central place for status text and button enabled/disabled states.
      function setCallState(state, label) {
        callState = state;
        statusEl.dataset.state = state;
        statusEl.textContent = label || state;

        startButton.disabled =
          state === "connecting" || state === "active" || state === "ending";
        endCallButton.disabled = !(state === "connecting" || state === "active");
      }

      // Starts elapsed-time display and arms the hard call-duration limit.
      function startTimer() {
        callStartedAt = Date.now();
        updateTimer();

        timerIntervalId = window.setInterval(updateTimer, 1000);
        maxCallTimeoutId = window.setTimeout(() => {
          endCall("max duration");
        }, MAX_CALL_MS);
      }

      function stopTimer() {
        clearInterval(timerIntervalId);
        clearTimeout(maxCallTimeoutId);

        timerIntervalId = null;
        maxCallTimeoutId = null;

        updateTimer();
      }

      // Closes browser resources only. Backend completion happens in endCall().
      function cleanupCallResources() {
        if (dataChannel && dataChannel.readyState !== "closed") {
          dataChannel.close();
        }

        if (peerConnection) {
          peerConnection.close();
        }

        if (localStream) {
          localStream.getTracks().forEach((track) => track.stop());
        }

        dataChannel = null;
        peerConnection = null;
        localStream = null;
      }

      function log(message) {
        const timestamp = new Date().toISOString();
        logMessages.push(`[${timestamp}] ${message}`);
        logEl.textContent += message + "\n";
      }

      function clearVisibleLog() {
        logEl.textContent = "";
      }

      // Clears old session data before a fresh Start Call attempt.
      function resetCallStateForNewCall() {
        clearTimeout(disconnectGraceTimeoutId);
        stopTimer();

        supabaseSessionId = null;
        callStartedAt = null;
        disconnectGraceTimeoutId = null;
        transcriptSaveChain = Promise.resolve();
        endingCall = false;

        updateTimer();
      }

      // Queue transcript writes so final turn rows are saved in order.
      function saveTranscriptLine(speaker, text) {
        if (!supabaseSessionId || !text || !text.trim()) {
          return;
        }

        const timestampOffsetMs = callStartedAt ? Date.now() - callStartedAt : 0;

        transcriptSaveChain = transcriptSaveChain
          .catch(() => {})
          .then(async () => {
            const response = await fetch(
              `http://localhost:8000/api/v1/sessions/${supabaseSessionId}/transcripts`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  speaker,
                  text: text.trim(),
                  timestamp_offset_ms: timestampOffsetMs,
                }),
              }
            );

            if (!response.ok) {
              console.warn("Transcript save failed:", await response.text());
            }
          });
      }

      // Current backend contract accepts ended_at and duration_seconds.
      async function markSessionCompleted(reason) {
        if (!supabaseSessionId) {
          return;
        }

        const durationSeconds = callStartedAt
          ? Math.round((Date.now() - callStartedAt) / 1000)
          : 0;
        const response = await fetch(
          `http://localhost:8000/api/v1/sessions/${supabaseSessionId}/end`,
          {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              ended_at: new Date().toISOString(),
              duration_seconds: durationSeconds,
            }),
          }
        );

        if (!response.ok) {
          console.warn(
            `Session end failed after ${reason}:`,
            await response.text()
          );
        }
      }

      // Single exit path for user click, timeout, disconnect, and channel close.
      async function endCall(reason) {
        if (
          endingCall ||
          callState === "idle" ||
          callState === "ended" ||
          callState === "error"
        ) {
          return;
        }

        endingCall = true;
        setCallState("ending", "Ending");

        clearTimeout(disconnectGraceTimeoutId);
        cleanupCallResources();

        try {
          await transcriptSaveChain;
        } catch (error) {
          console.warn("Transcript flush failed before ending call:", error);
        }

        try {
          await markSessionCompleted(reason);
        } catch (error) {
          console.warn("Session end failed:", error);
        }

        stopTimer();
        setCallState("ended", "Ended: " + reason);
        log("Call ended: " + reason);
      }

      // Save only finalized transcript events. Raw event noise stays in DevTools.
      function handleRealtimeEvent(rawEvent) {
        let payload;

        try {
          payload = JSON.parse(rawEvent.data);
        } catch {
          console.debug("Realtime event:", rawEvent.data);
          return;
        }

        console.debug("Realtime event:", payload);

        if (
          payload.type === "conversation.item.input_audio_transcription.completed"
        ) {
          saveTranscriptLine("rep", payload.transcript);
          log("Rep: " + payload.transcript);
        }

        if (payload.type === "response.output_audio_transcript.done") {
          saveTranscriptLine("ai_customer", payload.transcript);
          log("AI customer: " + payload.transcript);
        }
      }

      document.getElementById("downloadLog").onclick = () => {
        const logContent = logMessages.join("\n");
        const blob = new Blob([logContent], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `webrtc-log-${new Date().toISOString().slice(0, 10)}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      endCallButton.onclick = () => {
        endCall("user");
      };

      // Start flow: mic permission, backend session/token, WebRTC offer, OpenAI answer.
      startButton.onclick = async () => {
        try {
          clearVisibleLog();
          logMessages.length = 0;
          resetCallStateForNewCall();

          setCallState("connecting", "Connecting");
          log("Requesting microphone access...");

          localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });

          log("Microphone access granted in browser");
          log("Requesting ephemeral token from backend...");

          const tokenRes = await fetch(
            "http://localhost:8000/api/v1/realtime/session",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                scenario: "cold_call",
                rep_id: "7823e50f-f264-4856-8c66-d3c14431561c",
                business_id: "e00ac996-d133-4d26-a718-2e56945e48a0",
              }),
            }
          );

          if (!tokenRes.ok) {
            const errorText = await tokenRes.text();
            throw new Error(
              "Backend token request failed with status " +
                tokenRes.status +
                ": " +
                errorText
            );
          }

          const tokenData = await tokenRes.json();
          const clientSecret = tokenData.client_secret;
          supabaseSessionId = tokenData.session_id;

          if (!clientSecret) {
            throw new Error("Backend response did not include client_secret");
          }

          if (!supabaseSessionId) {
            throw new Error("Backend response did not include session_id");
          }

          log("Ephemeral token received");

          peerConnection = new RTCPeerConnection();

          peerConnection.onconnectionstatechange = (event) => {
            const connection = event.currentTarget;
            const state = connection.connectionState;
            console.debug("Peer connection state:", state);

            // A disconnected state can recover, so wait briefly before ending.
            if (state === "connected") {
              clearTimeout(disconnectGraceTimeoutId);
              disconnectGraceTimeoutId = null;
            }

            if (state === "failed" || state === "closed") {
              endCall(state);
            }

            if (state === "disconnected") {
              clearTimeout(disconnectGraceTimeoutId);
              disconnectGraceTimeoutId = window.setTimeout(() => {
                endCall("disconnect");
              }, DISCONNECT_GRACE_MS);
            }
          };

          const remoteAudio = document.createElement("audio");
          remoteAudio.autoplay = true;

          peerConnection.ontrack = (event) => {
            remoteAudio.srcObject = event.streams[0];
          };

          log("WebRTC peer connection object created");

          localStream.getTracks().forEach((track) => {
            peerConnection.addTrack(track, localStream);
          });

          log("Audio streaming confirmed: microphone track added");

          dataChannel = peerConnection.createDataChannel("oai-events");

          dataChannel.onopen = () => {
            console.debug("Data channel open for events");
          };

          dataChannel.onmessage = handleRealtimeEvent;

          dataChannel.onclose = () => {
            if (!endingCall && callState === "active") {
              endCall("data channel closed");
            }
          };

          log("Data channel created");

          const offer = await peerConnection.createOffer();
          log("SDP offer created");

          await peerConnection.setLocalDescription(offer);
          log("Local description set");

          const realtimeRes = await fetch(
            "https://api.openai.com/v1/realtime/calls",
            {
              method: "POST",
              headers: {
                Authorization: "Bearer " + clientSecret,
                "Content-Type": "application/sdp",
              },
              body: offer.sdp,
            }
          );

          if (!realtimeRes.ok) {
            const errorText = await realtimeRes.text();
            throw new Error(
              "OpenAI WebRTC connection failed with status " +
                realtimeRes.status +
                ": " +
                errorText
            );
          }

          const answerSdp = await realtimeRes.text();

          await peerConnection.setRemoteDescription({
            type: "answer",
            sdp: answerSdp,
          });

          setCallState("active", "Active");
          startTimer();

          log("Remote description set: connected to OpenAI");
          log("Connection ready. Say: Hi, I'm calling about AI Sales Coach");
        } catch (error) {
          clearTimeout(disconnectGraceTimeoutId);
          cleanupCallResources();
          stopTimer();
          setCallState("error", "Error");
          log("Error: " + error.message);
          console.error(error);
        }
      };
    </script>
  </body>
</html>
