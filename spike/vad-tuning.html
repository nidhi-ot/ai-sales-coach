<!DOCTYPE html>
<html>
  <head>
    <title>VAD Tuning Spike</title>
  </head>

  <body>
    <h1>OpenAI Realtime VAD Tuning Test</h1>

    <!-- Buttons for the user -->
    <button id="start">Start Call</button>
    <button id="endCall" disabled>End Call</button>
    <button id="downloadLog">Download Log</button>
    <!--
      Historical Day 3 server VAD controls.
      Current live calls use semantic_vad with eagerness=medium in the backend,
      so these threshold values no longer change OpenAI's live VAD behavior.
    -->
    <div>
      <label for="vadConfig">VAD config:</label>
      <select id="vadConfig">
        <option value="default">Default: threshold 0.5, silence 500ms</option>
        <option value="sensitive">Sensitive: threshold 0.3, silence 200ms</option>
        <option value="conservative">Conservative: threshold 0.7, silence 800ms</option>
      </select>
    </div>
    <p>Test phrase: Hi, I'm calling about AI Sales Coach</p>
    <p>
      During the call, click False Positive if the AI cuts you off, False Negative if
      the AI waits too long, or Good Turn if the timing feels correct.
    </p>
    <div>
      <button id="falsePositive">False Positive</button>
      <button id="falseNegative">False Negative</button>
      <button id="goodTurn">Good Turn</button>
    </div>

    <textarea id="testNotes" placeholder="Notes about this VAD test"></textarea>
    
    <!-- This area shows log messages on the page -->
    <pre id="log"></pre>

    <script>
      // Array to store all logs
      const logMessages = [];

      // These variables keep track of the active call so we can end it cleanly.
      let activeSessionId = null;
      let callStartedAt = null;
      let callTimeoutId = null;
      let activePeerConnection = null;
      let activeStream = null;
      let activeDataChannel = null;
      let transcriptBuffer = [];        

      // Hard cap for practice calls: 10 minutes.
      const CALL_TIMEOUT_MS = 10 * 60 * 1000;

      // VAD settings we will test during Task 3.1
      const vadConfigs = {
        default: {
          label: "Default",
          threshold: 0.5,
          silence_duration_ms: 500,
        },
        sensitive: {
          label: "Sensitive",
          threshold: 0.3,
          silence_duration_ms: 200,
        },
        conservative: {
          label: "Conservative",
          threshold: 0.7,
          silence_duration_ms: 800,
        },
      };

      // These counters help us measure VAD behavior during each test run.
      let falsePositiveCount = 0;
      let falseNegativeCount = 0;
      let goodTurnCount = 0;

      // Helper function to print messages on the page and store them
      function log(message) {
        const timestamp = new Date().toISOString();
        logMessages.push(`[${timestamp}] ${message}`);
        document.getElementById("log").textContent += message + "\n";
      }

      function timestampOffsetMs() {
        return callStartedAt ? Date.now() - callStartedAt.getTime() : 0;
      }

      // Realtime transcript events are buffered locally until the call ends.
      function bufferTranscriptLine(speaker, text) {
        if (!text || !text.trim()) {
          return;
        }

        transcriptBuffer.push({
          speaker,
          text: text.trim(),
          timestamp_offset_ms: timestampOffsetMs(),
        });
      }

      async function saveTranscriptBatch(sessionId) {
        if (!transcriptBuffer.length) {
          log("No transcript captured; skipping transcript save.");
          return false;
        }

        const response = await fetch(
          "http://localhost:8000/api/v1/sessions/" +
            sessionId +
            "/transcripts/batch",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              entries: transcriptBuffer,
            }),
          }
        );

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(
            "Transcript batch save failed with status " +
              response.status +
              ": " +
              errorText
          );
        }

        log("Saved transcript lines: " + transcriptBuffer.length);
        return true;
      }

      async function runScorecardAnalysis(sessionId) {
        const response = await fetch(
          "http://localhost:8000/api/v1/scorecards/" + sessionId + "/analyze",
          {
            method: "POST",
          }
        );

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(
            "Scorecard analysis failed with status " +
              response.status +
              ": " +
              errorText
          );
        }

        const scorecard = await response.json();
        log("Scorecard created. Overall score: " + scorecard.overall_score);
      }

      function handleRealtimeEvent(event) {
        let payload;

        try {
          payload = JSON.parse(event.data);
        } catch {
          console.debug("Realtime event:", event.data);
          return;
        }

        console.debug("Realtime event:", payload);

        if (
          payload.type === "conversation.item.input_audio_transcription.completed"
        ) {
          if (typeof payload.transcript === "string" && payload.transcript.trim()) {
            bufferTranscriptLine("rep", payload.transcript);
            log("Rep: " + payload.transcript);
          }
        }

        if (payload.type === "response.output_audio_transcript.done") {
          if (typeof payload.transcript === "string" && payload.transcript.trim()) {
            bufferTranscriptLine("ai_customer", payload.transcript);
            log("AI customer: " + payload.transcript);
          }
        }
      }

      // End the call, save the finished transcript, then analyze the scorecard.
      async function endCall(endReason) {
        if (!activeSessionId) {
          log("No active session to end.");
          return;
        }

        const endedAt = new Date();
        const durationSeconds = callStartedAt
          ? Math.round((endedAt - callStartedAt) / 1000)
          : 0;

        const sessionIdToEnd = activeSessionId;

        if (callTimeoutId) {
          clearTimeout(callTimeoutId);
          callTimeoutId = null;
        }

        if (activeStream) {
          activeStream.getTracks().forEach((track) => {
            track.stop();
          });
          activeStream = null;
        }

        if (activeDataChannel) {
          activeDataChannel.close();
          activeDataChannel = null;
        }

        if (activePeerConnection) {
          activePeerConnection.close();
          activePeerConnection = null;
        }

        document.getElementById("endCall").disabled = true;
        document.getElementById("start").disabled = false;

        activeSessionId = null;
        callStartedAt = null;

        log(
          "Ending session. Reason: " +
            endReason +
            ", duration: " +
            durationSeconds +
            " seconds"
        );

        let transcriptSaved = false;

        try {
          transcriptSaved = await saveTranscriptBatch(sessionIdToEnd);
        } catch (error) {
          log("Failed to save transcript: " + error.message);
        }

        let sessionEnded = false;

        try {
          const endRes = await fetch(
            "http://localhost:8000/api/v1/sessions/" + sessionIdToEnd + "/end",
            {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                ended_at: endedAt.toISOString(),
                duration_seconds: durationSeconds,
                end_reason: endReason,
              }),
            }
          );

          if (!endRes.ok) {
            const errorText = await endRes.text();
            throw new Error(
              "Backend session end failed with status " +
                endRes.status +
                ": " +
                errorText
            );
          }

          sessionEnded = true;

          log("✅ Backend session ended successfully");
        } catch (error) {
          log("❌ Failed to notify backend that session ended: " + error.message);
        }
        if (sessionEnded && transcriptSaved) {
        //   try {
        //     await runScorecardAnalysis(sessionIdToEnd);
        //   } catch (error) {
        //     log("Failed to create scorecard: " + error.message);
        //   }
          log (" Skipping scorecard analysis for now");
        } 
      }

      // Let the user end the call before the 10-minute timeout.
      document.getElementById("endCall").onclick = () => {
        endCall("manual");
      };

      // Mark when the AI starts responding too early or cuts you off.
      document.getElementById("falsePositive").onclick = () => {
        falsePositiveCount += 1;
        log("False positive recorded. Total: " + falsePositiveCount);
      };

      // Mark when the AI waits too long or does not stop listening/respond.
      document.getElementById("falseNegative").onclick = () => {
        falseNegativeCount += 1;
        log("False negative recorded. Total: " + falseNegativeCount);
      };

      // Mark when the turn-taking feels correct.
      document.getElementById("goodTurn").onclick = () => {
        goodTurnCount += 1;
        log("Good turn recorded. Total: " + goodTurnCount);
      };

      // Function to download logs as a file
      document.getElementById("downloadLog").onclick = () => {
        const notes = document.getElementById("testNotes").value;
        const selectedVadKey = document.getElementById("vadConfig").value;
        const selectedVadConfig = vadConfigs[selectedVadKey];

        const logContent =
          logMessages.join("\n") +
          "\n\nSummary:\n" +
          "VAD config: " +
          selectedVadConfig.label +
          " (threshold=" +
          selectedVadConfig.threshold +
          ", silence=" +
          selectedVadConfig.silence_duration_ms +
          "ms)\n" +
          "False positives: " +
          falsePositiveCount +
          "\nFalse negatives: " +
          falseNegativeCount +
          "\nGood turns: " +
          goodTurnCount +
          "\nTranscript lines: " +
          transcriptBuffer.length +
          "\n\nNotes:\n" +
          notes;
        const blob = new Blob([logContent], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `vad-tuning-log-${new Date().toISOString().slice(0, 10)}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      // Run this function when the Start Call button is clicked
      document.getElementById("start").onclick = async () => {
        try {
          transcriptBuffer = [];
          falsePositiveCount = 0;
          falseNegativeCount = 0;
          goodTurnCount = 0;
          document.getElementById("log").textContent = "";
          logMessages.length = 0;

          const selectedVadKey = document.getElementById("vadConfig").value;
          const selectedVadConfig = vadConfigs[selectedVadKey];

          log(
            "Testing VAD config: " +
              selectedVadConfig.label +
              " (threshold=" +
              selectedVadConfig.threshold +
              ", silence=" +
              selectedVadConfig.silence_duration_ms +
              "ms)"
          );

          // Step 1: Ask the browser for microphone permission
          log("Requesting microphone access...");

          const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
          });
          
          activeStream = stream;

          log("✅ Microphone access granted in browser");

            // Step 2: Ask our backend for a short-lived OpenAI Realtime token
            // The backend keeps the real OpenAI API key secret.
            log("Requesting ephemeral token from backend...");

            const tokenRes = await fetch("http://localhost:8000/api/v1/realtime/session", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    scenario: "cold_call",
                    rep_id: "7823e50f-f264-4856-8c66-d3c14431561c",
                    business_id: "e00ac996-d133-4d26-a718-2e56945e48a0",
                    vad: {
                      threshold: selectedVadConfig.threshold,
                      silence_duration_ms: selectedVadConfig.silence_duration_ms,
                    },
                }),
            });

            if (!tokenRes.ok) {
            const errorText = await tokenRes.text();
            throw new Error(
                "Backend token request failed with status " +
                tokenRes.status +
                ": " +
                errorText
            );
            }

            const tokenData = await tokenRes.json();
            const clientSecret = tokenData.client_secret;
            activeSessionId = tokenData.session_id;

            if (!clientSecret) {
            throw new Error("Backend response did not include client_secret");
            }

            if (!activeSessionId) {
              throw new Error("Backend response did not include session_id");
            }

            callStartedAt = new Date();
            log("Backend session id: " + activeSessionId);

            log("Ephemeral token received: " + clientSecret.slice(0, 20) + "...");
            log(
              "Backend accepted VAD config: " +
                selectedVadConfig.label +
                " (threshold=" +
                selectedVadConfig.threshold +
                ", silence=" +
                selectedVadConfig.silence_duration_ms +
                "ms)"
            );

            // Step 3: Create a WebRTC peer connection
            // This represents the "call connection"
            const peerConnection = new RTCPeerConnection();
            activePeerConnection = peerConnection;

            // Play the AI customer's audio when OpenAI sends it back
            const remoteAudio = document.createElement("audio");
            remoteAudio.autoplay = true;

            peerConnection.ontrack = (event) => {
                remoteAudio.srcObject = event.streams[0];
            };
            log("✅ WebRTC peer connection object created");

            // Step 4: Add microphone audio to the WebRTC connection
            // This prepares the user's voice to be streamed
            stream.getTracks().forEach((track) => {
                peerConnection.addTrack(track, stream);
            });

            log("✅ Audio streaming confirmed: microphone track added");

            // Step 5: Create a data channel
            // This is used for non-audio events/messages
            const dataChannel =
                peerConnection.createDataChannel("oai-events");
            activeDataChannel = dataChannel;

            // This runs when the data channel is fully open
            // It may not open until connected to a real remote peer like OpenAI
            dataChannel.onopen = () => {
                log("✅ Data channel open for events");
            };

            // Transcript events are stored locally and saved after End Call.
            dataChannel.onmessage = handleRealtimeEvent;

            log("✅ Data channel created");

            // Print useful debugging information in browser DevTools Console
            // console.log("Stream:", stream);
            // console.log("Peer connection:", peerConnection);
            // console.log("Data channel:", dataChannel);

            // Step 6: Create an SDP offer (call invitation)
            // SDP describes what this browser wants for the WebRTC connection
            const offer = await peerConnection.createOffer();

            log("✅ SDP offer created");

            // Step 7: Save the offer as the local browser description
            // This prepares the browser side of the WebRTC connection
            await peerConnection.setLocalDescription(offer);

            log("✅ Local description set");

            // Step 8: Send the browser's offer to OpenAI and get an answer back
            const realtimeRes = await fetch("https://api.openai.com/v1/realtime/calls", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + clientSecret,
                    "Content-Type": "application/sdp",
                },
                body: offer.sdp,
            });

            if (!realtimeRes.ok) {
                const errorText = await realtimeRes.text();
                throw new Error(
                    "OpenAI WebRTC connection failed with status " +
                    realtimeRes.status +
                    ": " +
                    errorText
                );
            }

            const answerSdp = await realtimeRes.text();

            // Step 9: Save OpenAI's answer as the remote description
            // This completes the WebRTC connection setup.
            await peerConnection.setRemoteDescription({
                type: "answer",
                sdp: answerSdp,
            });

            log("✅ Remote description set: connected to OpenAI");
            log("✅ Connection ready. Say: Hi, I'm calling about AI Sales Coach");

            document.getElementById("start").disabled = true;
            document.getElementById("endCall").disabled = false;

            callTimeoutId = setTimeout(() => {
              log("10-minute session timeout reached.");
              endCall("timeout");
            }, CALL_TIMEOUT_MS);

        } catch (error) {
          // If anything fails, show the error on the page and in console
          log("❌ Error: " + error.message);
          // console.error(error);
        }
      };
    </script>
  </body>
</html>
